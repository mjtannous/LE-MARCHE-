<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Testez un abonnement de livraison</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --mint: #00a896; --mint-soft: #e3f6f3; --ink2: #2b2f38; --uber: #111; }
  body { min-height: 100vh; background: radial-gradient(1200px 500px at 50% -200px, #e3f6f3, var(--bg)); }
  main { max-width: 560px; padding-top: 14px; padding-bottom: 60px; }

  /* barre du haut : retour et progression par chapitres */
  .top { position: sticky; top: 0; z-index: 5; padding: 10px 0 10px; background: linear-gradient(var(--bg) 75%, transparent); }
  .top-row { display: flex; align-items: center; gap: 12px; }
  #back { margin: 0; padding: 6px 12px; font-size: .85rem; border-radius: 999px; background: #fff; color: var(--ink); border: 1px solid var(--line); flex: none; }
  #back:hover { border-color: var(--ink); }
  #back[hidden] { display: none; }
  .chapters { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .chapters div { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .chapters i { display: block; height: 100%; width: 0; background: var(--mint); transition: width .5s ease; }
  .chapter-name { font-size: .75rem; color: var(--muted); margin-top: 7px; letter-spacing: .04em; }

  .screen { animation: arrive .4s ease both; }
  @keyframes arrive { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen, .card, .scooter, .confetti { animation: none !important; } }

  .kicker { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--mint); margin: 16px 0 6px; }
  .title { font-family: var(--serif); font-size: clamp(1.6rem, 6.5vw, 2.2rem); line-height: 1.15; margin: 0 0 10px; }
  .title.s { font-size: 1.35rem; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .btn { display: block; width: 100%; margin: 14px 0 0; padding: 15px; font-size: 1.05rem; border-radius: 12px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .btn.ghost:hover { background: #fff; color: var(--ink); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .err { margin: 10px 0 0; }

  /* accueil */
  .hero-ill { font-size: 3.2rem; letter-spacing: 6px; margin: 8px 0 0; }
  .steps3 { display: grid; gap: 8px; margin: 16px 0; }
  .steps3 div { display: flex; gap: 12px; align-items: center; background: #fff; border-radius: 12px; padding: 12px 14px; font-size: .95rem; }
  .steps3 b { display: grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--mint-soft); color: var(--mint); }
  .consent { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; margin-top: 14px; cursor: pointer; }
  .consent input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--ink); }

  /* matrice d'usage */
  .matrix { display: grid; gap: 10px; }
  .mrow { background: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 2px 10px rgba(22,24,29,.05); }
  .mrow b { display: block; margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .seg button { margin: 0; padding: 9px 4px; font-size: .78rem; line-height: 1.2; border-radius: 9px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .seg button:hover { border-color: var(--ink); background: var(--bg); color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--mint); border-color: var(--mint); color: #fff; }

  /* tuiles */
  .tiles { display: grid; gap: 10px; }
  .tile { display: flex; align-items: center; gap: 12px; width: 100%; margin: 0; padding: 15px 16px; text-align: left; font-size: 1rem; font-weight: 500; background: #fff; color: var(--ink); border: 1px solid #dcd9d0; border-radius: 12px; }
  .tile:hover { background: #fff; color: var(--ink); border-color: var(--ink); }
  .tile[aria-pressed="true"] { border-color: var(--mint); background: var(--mint-soft); box-shadow: inset 0 0 0 1px var(--mint); }
  .tile .ico { font-size: 1.4rem; width: 1.8rem; text-align: center; }

  /* le choix d'abonnement : le test A/B */
  .offers { display: grid; gap: 14px; }
  @media (min-width: 640px) { main.wide { max-width: 860px; } .offers { grid-template-columns: 1.35fr 1fr; align-items: start; } }
  .offer { background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 14px 34px rgba(22,24,29,.12); }
  .offer .band { padding: 16px 20px 14px; color: #fff; }
  .offer.dlv .band { background: linear-gradient(135deg, #00a896, #007a6e); }
  .offer.ub .band { background: linear-gradient(135deg, #2b2f38, #111); }
  .offer .band small { font-size: .7rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
  .offer .band b { display: block; font-family: var(--serif); font-size: 1.35rem; font-weight: 500; margin-top: 2px; }
  .offer .body { padding: 16px 20px 18px; }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
  .chips button { margin: 0; padding: 8px 4px; border-radius: 10px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); font-size: .8rem; line-height: 1.25; }
  .chips button b { display: block; font-family: var(--serif); font-size: 1.15rem; font-weight: 500; }
  .chips button:hover { border-color: var(--ink); background: var(--bg); color: var(--ink); }
  .chips button[aria-pressed="true"] { background: var(--mint-soft); border-color: var(--mint); box-shadow: inset 0 0 0 1px var(--mint); }
  .plan-name { font-weight: 700; font-size: 1.05rem; }
  .plan-tag { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: var(--mint); color: #fff; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  .price { font-family: var(--serif); font-size: 2.5rem; line-height: 1; margin: 8px 0 12px; }
  .price small { font-family: var(--sans); font-size: .9rem; color: var(--muted); }
  .perks { list-style: none; padding: 0; margin: 0; }
  .perks li { padding: 5px 0 5px 28px; position: relative; font-size: .93rem; }
  .perks li::before { content: "✓"; position: absolute; left: 0; top: 5px; width: 20px; height: 20px; border-radius: 50%; background: var(--mint-soft); color: var(--mint); font-size: .75rem; font-weight: 700; display: grid; place-items: center; }
  .perks li.minus::before { content: "–"; background: #f3f1ea; color: var(--muted); }
  .offer.ub .perks li::before { background: #ececec; color: #111; }
  .offer .btn { margin-top: 16px; }
  .offer.ub .btn { background: var(--uber); border-color: var(--uber); }
  .none-btn { display: block; margin: 16px auto 0; background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: .92rem; }
  .none-btn:hover { background: none; color: var(--ink); }
  .note { font-size: .75rem; color: var(--muted); text-align: center; margin: 12px 0 0; }

  /* scènes */
  .mine { display: flex; align-items: center; gap: 8px; font-size: .85rem; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; width: fit-content; }
  .scene-head { display: flex; align-items: center; gap: 12px; background: var(--ink2); color: #fff; border-radius: 16px; padding: 16px 18px; margin: 12px 0 16px; }
  .scene-head .clock { font-size: 2rem; }
  .scene-head b { display: block; font-size: 1.05rem; }
  .scene-head span { font-size: .9rem; opacity: .8; }
  .same-price { font-size: .85rem; color: var(--muted); margin: -6px 0 12px; }
  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dish { margin: 0; padding: 0; border: 0; border-radius: 16px; overflow: hidden; text-align: left; background: #fff; color: var(--ink); box-shadow: 0 2px 10px rgba(22,24,29,.07); transition: transform .15s, box-shadow .15s; }
  .dish:hover { background: #fff; color: var(--ink); transform: translateY(-3px); box-shadow: 0 10px 22px rgba(22,24,29,.12); }
  .dish .pic { height: 88px; display: grid; place-items: center; font-size: 2.8rem; }
  .dish .txt { padding: 10px 12px 12px; font-weight: 600; font-size: .92rem; line-height: 1.25; }
  .dish.home { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: transparent; border: 1px dashed #c9c6bd; box-shadow: none; font-weight: 600; }
  .dish.home .pic { height: auto; font-size: 1.7rem; }

  .receipt { background: #fff; border-radius: 16px; padding: 18px 18px 6px; box-shadow: 0 2px 12px rgba(22,24,29,.08); }
  .receipt .item { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
  .receipt .item .e { font-size: 2.2rem; }
  .line { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; font-size: .95rem; border-bottom: 1px solid var(--line); }
  .line.total { font-weight: 700; font-size: 1.1rem; border-bottom: 0; }
  .line .free { color: var(--mint); font-weight: 700; }
  .line s { color: var(--muted); margin-right: 6px; }
  .track { position: relative; height: 70px; margin: 26px 0 10px; border-bottom: 3px dotted #c9c6bd; }
  .scooter { position: absolute; bottom: 4px; left: 0; font-size: 2.4rem; animation: ride 1.8s ease-in-out forwards; }
  .track .home { position: absolute; right: 0; bottom: 4px; font-size: 2.2rem; }
  @keyframes ride { to { left: calc(100% - 90px); } }
  .delivered { text-align: center; font-family: var(--serif); font-size: 1.6rem; opacity: 0; transition: opacity .3s; }
  .delivered.on { opacity: 1; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
  .stats div { background: #fff; border-radius: 14px; padding: 14px 8px; text-align: center; box-shadow: 0 2px 10px rgba(22,24,29,.06); }
  .stats b { display: block; font-family: var(--serif); font-size: 1.45rem; }
  .stats span { font-size: .74rem; color: var(--muted); }

  /* le juste prix */
  .mood { text-align: center; font-size: 4rem; line-height: 1; margin: 10px 0 4px; transition: transform .2s; }
  .gauge-value { text-align: center; font-family: var(--serif); font-size: 3rem; margin: 0; }
  .gauge-value.idle { color: #c9c6bd; }
  input[type=range] { width: 100%; height: 44px; accent-color: var(--mint); }
  .scale { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); }
  .prev { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .prev span { font-size: .78rem; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .fine { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
  .fine button { margin: 0; padding: 6px 16px; border-radius: 999px; background: #fff; color: var(--ink); border: 1px solid var(--line); }

  .deck { position: relative; height: 270px; margin: 14px 0 10px; }
  .card { position: absolute; inset: 0; background: #fff; border-radius: 22px; box-shadow: 0 14px 34px rgba(22,24,29,.14); display: grid; place-items: center; text-align: center; touch-action: pan-y; user-select: none; cursor: grab; transition: transform .35s ease, opacity .35s ease; }
  .card .p { font-family: var(--serif); font-size: 3.6rem; line-height: 1; }
  .card .p small { display: block; font-family: var(--sans); font-size: .95rem; color: var(--muted); margin-top: 6px; }
  .card .stamp { position: absolute; top: 22px; font-weight: 800; font-size: 1.1rem; letter-spacing: .1em; padding: 4px 10px; border: 3px solid; border-radius: 8px; opacity: 0; }
  .card .stamp.yes { left: 22px; color: var(--mint); transform: rotate(-12deg); }
  .card .stamp.no { right: 22px; color: var(--neg); transform: rotate(12deg); }
  .card.behind { transform: scale(.95) translateY(12px); opacity: .6; }
  .swipe-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .swipe-btns button { margin: 0; padding: 16px; font-size: 1.1rem; border-radius: 14px; }
  .swipe-btns .no { background: #fff; color: var(--neg); border: 1px solid var(--neg); }
  .swipe-btns .yes { background: var(--mint); border-color: var(--mint); }
  .counter { text-align: center; font-size: .82rem; color: var(--muted); }

  .stepper { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 14px 0; }
  .stepper button { margin: 0; width: 56px; height: 56px; padding: 0; font-size: 1.6rem; border-radius: 50%; background: #fff; color: var(--ink); border: 1px solid var(--ink); }
  .stepper output { font-family: var(--serif); font-size: 3rem; min-width: 2.5ch; text-align: center; }

  .badge { text-align: center; background: #fff; border-radius: 22px; padding: 26px 20px; box-shadow: 0 14px 34px rgba(22,24,29,.1); margin: 18px 0; }
  .badge .e { font-size: 4rem; }
  .badge b { display: block; font-family: var(--serif); font-size: 1.6rem; margin-top: 6px; }
  .confetti { position: fixed; top: -20px; font-size: 1.4rem; animation: fall 2.4s linear forwards; pointer-events: none; z-index: 10; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
</style>
</head>
<body>
<main id="main">
  <div class="top" id="top" hidden>
    <div class="top-row">
      <button type="button" id="back">← Retour</button>
      <div class="chapters"><div><i id="c1"></i></div><div><i id="c2"></i></div><div><i id="c3"></i></div><div><i id="c4"></i></div></div>
    </div>
    <div class="chapter-name" id="chapter"></div>
  </div>
  <p id="testmode" class="todo" hidden><strong>Mode test</strong> Aucune adresse d'enregistrement n'est configurée : les réponses restent dans ce navigateur. Voir le fichier LISEZMOI.</p>
  <div id="app"></div>
</main>

<script>
// Adresse de l'application web Google Apps Script qui enregistre les réponses
// dans la feuille Google Sheets du groupe (voir LISEZMOI.md). Vide = mode test.
const ENDPOINT = "";

// Test A/B : seuls les prix des plans Deliveroo changent. A = prix bas (Plus Or au prix actuel), B = prix hauts.
const PLANS = {
  essentiel: { nom: "Plus Essentiel", prix: { A: 2.49, B: 3.49 },
    avantages: ["Livraison offerte dès 12 € d'achat", "−10 % sur les commandes de 25 € et plus"], moins: ["Frais de service à payer"] },
  or: { nom: "Plus Or", tag: "Tout compris", prix: { A: 3.49, B: 4.99 },
    avantages: ["Livraison offerte dès 12 € d'achat", "Aucuns frais de service", "Offres réservées aux abonnés"], moins: [] },
  famille: { nom: "Plus Famille", prix: { A: 6.99, B: 8.99 },
    avantages: ["Tous les avantages de Plus Or", "Partagé avec 4 personnes du foyer", "−10 % sur les commandes de 25 € et plus"], moins: [] }
};
// Le concurrent, au même prix dans les deux versions.
const UBER = { nom: "Uber One", prix: 5.99,
  avantages: ["Livraison à 0 € dès 12 € d'achat", "Frais de service réduits de moitié", "Avantages sur les trajets Uber"] };
// Prix soumis dans Gabor-Granger pour Plus Or, en ordre croissant, le même pour tous.
const GG_PRICES = [2.49, 3.49, 4.49, 4.99, 5.99, 6.99];
// Frais de la simulation (fictifs, du même ordre que ceux affichés par les applications).
const FRAIS = { livraison: 2.49, service: 0.99, seuilLivraison: 12, seuilRemise: 25, remise: 0.10 };

// Dans chaque scène, tous les plats ont le même prix : le choix du plat ne dépend pas du prix.
const SCENES = [
  { clock: "🌙", quand: "Lundi, 21 h", ambiance: "Longue journée. Le frigo est vide.", prix: 13.90,
    plats: [["burger", "🍔", "Smash burger & frites", "#ffd27a,#ff9a62"], ["sushi", "🍣", "Plateau de sushis", "#ffc3c3,#ff8e8e"], ["pizza", "🍕", "Pizza margherita", "#ffe29a,#f6b26b"], ["ramen", "🍜", "Ramen tonkotsu", "#ffe8c2,#f0b27a"]],
    maison: ["maison", "🍝", "Je me fais des pâtes"] },
  { clock: "☀️", quand: "Jeudi, 13 h", ambiance: "Pause déjeuner, pas le temps de sortir.", prix: 12.50,
    plats: [["poke", "🥗", "Poke bowl saumon", "#c8f2d4,#7fd6a4"], ["tacos", "🌮", "Tacos XL", "#ffe29a,#ffb36b"], ["wrap", "🌯", "Wrap poulet & boisson", "#f3e3c3,#d9b98a"], ["falafel", "🧆", "Assiette falafels", "#e5f0c8,#b9d77f"]],
    maison: ["maison", "🥖", "Je descends à la boulangerie"] },
  { clock: "🎉", quand: "Samedi, 20 h", ambiance: "Un ami passe dîner. Commande pour deux.", prix: 29.80,
    plats: [["pizzas", "🍕", "2 pizzas à partager", "#ffe29a,#f6b26b"], ["curry", "🍛", "Curry & naans pour 2", "#ffd9a8,#e9a15e"], ["padthai", "🍜", "Pad thaï x2", "#ffe8c2,#f0b27a"], ["burgers", "🍔", "2 burgers & frites", "#ffd27a,#ff9a62"]],
    maison: ["maison", "🍳", "On cuisine ensemble"] }
];

const answers = {
  id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
  horodatage: new Date().toISOString(),
  // Tirage au sort de la version à l'ouverture du questionnaire, une chance sur deux.
  version: Math.random() < 0.5 ? "A" : "B"
};
answers.prix_affiche = PLANS.or.prix[answers.version];
const V = answers.version;
const consultes = new Set(["or"]);
let ongletChoix = "or";
const commandes = [null, null, null]; // { total, economie } par scène, recalculé si le répondant revient en arrière

const euro = p => p.toFixed(2).replace(".", ",") + " €";
const key = p => p.toFixed(2).replace(".", "_");
const round2 = x => Math.round(x * 100) / 100;
const $ = s => document.querySelector(s);
const app = $("#app");
if (!ENDPOINT) $("#testmode").hidden = false;

// Frais d'une commande selon l'abonnement choisi.
function addition(plan, sousTotal) {
  const livre = sousTotal >= FRAIS.seuilLivraison;
  let livraison = FRAIS.livraison, service = FRAIS.service, remise = 0;
  if (plan === "essentiel") { if (livre) livraison = 0; if (sousTotal >= FRAIS.seuilRemise) remise = sousTotal * FRAIS.remise; }
  if (plan === "or") { if (livre) { livraison = 0; service = 0; } }
  if (plan === "famille") { if (livre) { livraison = 0; service = 0; } if (sousTotal >= FRAIS.seuilRemise) remise = sousTotal * FRAIS.remise; }
  if (plan === "uber_one") { if (livre) livraison = 0; service = round2(FRAIS.service / 2); }
  const total = round2(sousTotal - remise + livraison + service);
  const sans = round2(sousTotal + FRAIS.livraison + FRAIS.service);
  return { livraison, service, remise: round2(remise), total, economie: round2(sans - total) };
}
const nomPlan = p => p === "uber_one" ? UBER.nom : p === "aucun" ? "Sans abonnement" : PLANS[p].nom;
const prixPlan = p => p === "uber_one" ? UBER.prix : p === "aucun" ? 0 : PLANS[p].prix[V];

// Déroulé en quatre chapitres.
const FLOW = [
  ["accueil", 0], ["usage", 1],
  ["choix", 2], ["scene0", 2], ["scene1", 2], ["scene2", 2], ["recap", 2],
  ["controle", 3], ["vw1", 3], ["vw2", 3], ["vw3", 3], ["vw4", 3], ["gg", 3],
  ["age", 4], ["statut", 4], ["freq", 4], ["abo", 4], ["fin", 4]
];
const CHAPTERS = ["", "1 · Vous et la livraison", "2 · Choisissez et testez votre abonnement", "3 · Le juste prix", "4 · Pour finir"];
let pos = 0, sousEcran = false;

function go(i) {
  pos = i; sousEcran = false;
  const [name, ch] = FLOW[i];
  $("#top").hidden = ch === 0 || name === "fin";
  $("#back").hidden = false;
  [1, 2, 3, 4].forEach(c => {
    const etapes = FLOW.filter(f => f[1] === c && f[0] !== "fin");
    const fait = c < ch ? etapes.length : c === ch ? etapes.findIndex(f => f[0] === name) : 0;
    $("#c" + c).style.width = Math.round((fait / etapes.length) * 100) + "%";
  });
  $("#chapter").textContent = "Chapitre " + CHAPTERS[ch];
  $("#main").classList.toggle("wide", name === "choix");
  app.innerHTML = `<div class="screen">${SCREENS[name].html()}</div>`;
  window.scrollTo(0, 0);
  SCREENS[name].bind && SCREENS[name].bind();
}
const next = () => go(pos + 1);
// Retour : depuis un panier, on revient au choix du plat ; sinon à l'écran précédent.
$("#back").addEventListener("click", () => sousEcran ? go(pos) : pos > 0 && go(pos - 1));

function tiles(name, options) {
  return `<div class="tiles" data-single="${name}">${options.map(([v, label, ico]) =>
    `<button type="button" class="tile" data-value="${v}" aria-pressed="${answers[name] === v}">${ico ? `<span class="ico">${ico}</span>` : ""}${label}</button>`).join("")}</div>`;
}
function bindTiles() {
  const group = app.querySelector("[data-single]");
  group.addEventListener("click", e => {
    const t = e.target.closest(".tile"); if (!t) return;
    group.querySelectorAll(".tile").forEach(x => x.setAttribute("aria-pressed", x === t));
    answers[group.dataset.single] = t.dataset.value;
    setTimeout(next, 260);
  });
}

// Matrice d'usage des applications.
const APPS = [["uber_eats", "Uber Eats"], ["deliveroo", "Deliveroo"], ["just_eat", "Just Eat"], ["autre", "Une autre application"]];
const FREQS = [["jamais", "Jamais"], ["rare", "Moins d'une fois par mois"], ["mois", "1 à 3 fois par mois"], ["semaine", "Chaque semaine"]];

function sceneScreen(n) {
  const s = SCENES[n];
  return {
    html: () => `

      if (!plat) { commandes[n] = null; return next(); }
      panier(n, plat);
    }))
  };
}
function panier(n, [k, e, nom]) {
  sousEcran = true;
  const s = SCENES[n], plan = answers.plan_choisi, a = addition(plan, s.prix);
  const badge = plan === "aucun" ? "" : ` · ${nomPlan(plan)}`;
  app.innerHTML = `<div class="screen">
    <p class="kicker">Votre panier${badge}</p>
    <div class="receipt">
      <div class="item"><span class="e">${e}</span><div><b>${nom}</b><br><span class="src">${euro(s.prix)}</span></div></div>

      <div class="line"><span>Frais de livraison</span><span>${a.livraison === 0 ? `<s>${euro(FRAIS.livraison)}</s><span class="free">Offerte</span>` : euro(a.livraison)}</span></div>
      <div class="line"><span>Frais de service</span><span>${a.service < FRAIS.service ? `<s>${euro(FRAIS.service)}</s>` : ""}${a.service === 0 ? '<span class="free">Offerts</span>' : euro(a.service)}</span></div>
      <div class="line total"><span>Total</span><span>${euro(a.total)}</span></div>
    </div>
    ${a.economie > 0 ? `<p class="src">Votre abonnement vous fait économiser ${euro(a.economie)} sur cette commande.</p>` : ""}
    <button type="button" class="btn" id="cmd">Commander · ${euro(a.total)}</button>
    <button type="button" class="btn ghost" id="annuler">Finalement non, je m'en passe</button>
  </div>`;
  $("#annuler").addEventListener("click", () => { answers["sim_" + (n + 1)] = "annule"; commandes[n] = null; next(); });
  $("#cmd").addEventListener("click", () => {
    commandes[n] = { total: a.total, economie: a.economie };
    $("#back").hidden = true;
    app.innerHTML = `<div class="screen">
      <p class="kicker">Commande en route</p>
      <p class="title">${e} arrive…</p>
      <div class="track"><span class="scooter">🛵</span><span class="home">🏠</span></div>
      <p class="delivered" id="ok">Livré ! Bon appétit 😋</p></div>`;
    setTimeout(() => $("#ok") && $("#ok").classList.add("on"), 1800);
    setTimeout(next, 2700);
  });
}

const VW = [
  { k: "vw_trop_bon_marche", mood: "🤨", q: "À partir de quel prix mensuel le plan Plus Or serait-il <b>si bon marché</b> que vous douteriez de sa qualité ?" },
  { k: "vw_bon_marche", mood: "😊", q: "À quel prix mensuel le plan Plus Or serait-il une <b>bonne affaire</b> ?" },
  { k: "vw_cher", mood: "😬", q: "À quel prix mensuel commencerait-il à être <b>cher</b>, sans exclure de le prendre ?" },
  { k: "vw_trop_cher", mood: "🙅", q: "À partir de quel prix mensuel serait-il <b>trop cher</b> pour que vous l'envisagiez ?" }
];
function vwScreen(i) {
  const v = VW[i];
  return {
    html: () => `
      <p class="kicker">Le juste prix · ${i + 1} / 4</p>
      <p class="title s">${v.q}</p>
      <p class="sub">Plus Or : livraison offerte dès 12 €, aucuns frais de service. Répondez indépendamment des prix vus jusqu'ici, en faisant glisser le curseur.</p>
      <div class="mood" id="mood">${v.mood}</div>
      <p class="gauge-value${answers[v.k] === undefined ? " idle" : ""}" id="val">${answers[v.k] === undefined ? "? €" : euro(answers[v.k])}</p>
      <input type="range" id="rng" min="0" max="20" step="0.1" value="${answers[v.k] ?? 0}" aria-label="Prix mensuel en euros">
      <div class="scale"><span>0 €</span><span>10 €</span><span>20 € et plus</span></div>
      <div class="fine"><button type="button" id="moins">− 0,10 €</button><button type="button" id="plus">+ 0,10 €</button></div>
      ${i ? `<div class="prev">${VW.slice(0, i).map(p => `<span>${p.mood} ${euro(answers[p.k])}</span>`).join("")}</div>` : ""}
      <p class="err" id="err" hidden>Faites glisser le curseur pour indiquer un prix.</p>
      <button type="button" class="btn" id="ok">Valider</button>`,
    bind: () => {
      let touched = answers[v.k] !== undefined;
      const rng = $("#rng");
      const show = () => { touched = true; $("#val").textContent = euro(Number(rng.value)); $("#val").classList.remove("idle"); $("#mood").style.transform = `scale(${1 + Number(rng.value) / 40})`; };
      rng.addEventListener("input", show);
      $("#moins").addEventListener("click", () => { rng.value = Math.max(0, Number(rng.value) - 0.1).toFixed(1); show(); });
      $("#plus").addEventListener("click", () => { rng.value = Math.min(20, Number(rng.value) + 0.1).toFixed(1); show(); });
      $("#ok").addEventListener("click", () => {
        if (!touched) { $("#err").hidden = false; return; }
        answers[v.k] = round2(Number(rng.value));
        if (i === 3) {
          const a = VW.map(p => answers[p.k]);
          // Les quatre réponses doivent monter ; sinon le répondant sera écarté à l'analyse.
          answers.vw_coherent = a[0] <= a[1] && a[1] <= a[2] && a[2] <= a[3] ? 1 : 0;
        }
        next();
      });
    }
  };
}

};

async function send() {
  if (!ENDPOINT) {
    const all = JSON.parse(localStorage.getItem("reponses_test") || "[]");
    all.push(answers);
    localStorage.setItem("reponses_test", JSON.stringify(all));
    return;
  }
  try {
    // text/plain + no-cors : Apps Script n'accepte pas les requêtes préliminaires CORS.
    await fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(answers) });
  } catch (e) {
    const msg = $("#fin-msg");
    if (msg) msg.textContent = "L'envoi a échoué. Vérifiez votre connexion et rechargez la page pour recommencer.";
  }
}

go(0);
