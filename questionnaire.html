<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Le défi : un mois de livraisons</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --mint: #00a896; --mint-soft: #e3f6f3; --ink2: #2b2f38; }
  body { min-height: 100vh; background: radial-gradient(1200px 500px at 50% -200px, #e3f6f3, var(--bg)); }
  main { max-width: 520px; padding-top: 18px; padding-bottom: 60px; }

  /* progression par chapitres */
  .top { position: sticky; top: 0; z-index: 5; padding: 12px 0 10px; background: linear-gradient(var(--bg) 70%, transparent); }
  .chapters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .chapters div { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .chapters i { display: block; height: 100%; width: 0; background: var(--mint); transition: width .5s ease; }
  .chapter-name { font-size: 0.75rem; color: var(--muted); margin-top: 7px; letter-spacing: .04em; }

  .screen { animation: arrive .4s ease both; }
  @keyframes arrive { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen, .card, .scooter { animation: none !important; } }

  .kicker { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--mint); margin: 18px 0 6px; }
  .title { font-family: var(--serif); font-size: clamp(1.7rem, 6.5vw, 2.2rem); line-height: 1.15; margin: 0 0 10px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .btn { display: block; width: 100%; margin: 14px 0 0; padding: 15px; font-size: 1.05rem; border-radius: 12px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .btn.ghost:hover { background: #fff; color: var(--ink); }
  .err { margin: 10px 0 0; }

  /* accueil */
  .hero-ill { font-size: 3.4rem; letter-spacing: 6px; margin: 10px 0 4px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  .facts span { font-size: .82rem; padding: 6px 12px; border-radius: 999px; background: #fff; border: 1px solid var(--line); }
  .consent { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; margin-top: 16px; cursor: pointer; }
  .consent input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--ink); }

  /* tuiles */
  .tiles { display: grid; gap: 10px; }
  .tile { display: flex; align-items: center; gap: 12px; width: 100%; margin: 0; padding: 15px 16px; text-align: left; font-size: 1rem; font-weight: 500; background: #fff; color: var(--ink); border: 1px solid #dcd9d0; border-radius: 12px; transition: border-color .15s, transform .1s, box-shadow .15s; }
  .tile:hover { background: #fff; color: var(--ink); border-color: var(--ink); }
  .tile:active { transform: scale(.98); }
  .tile[aria-pressed="true"] { border-color: var(--mint); background: var(--mint-soft); box-shadow: inset 0 0 0 1px var(--mint); }
  .tile .ico { font-size: 1.4rem; width: 1.8rem; text-align: center; }

  /* scènes : cartes de plats */
  .scene-head { display: flex; align-items: center; gap: 12px; background: var(--ink2); color: #fff; border-radius: 16px; padding: 16px 18px; margin: 14px 0 16px; }
  .scene-head .clock { font-size: 2rem; }
  .scene-head b { display: block; font-size: 1.05rem; }
  .scene-head span { font-size: .9rem; opacity: .8; }
  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dish { margin: 0; padding: 0; border: 0; border-radius: 16px; overflow: hidden; text-align: left; background: #fff; color: var(--ink); box-shadow: 0 2px 10px rgba(22,24,29,.07); transition: transform .15s, box-shadow .15s; }
  .dish:hover { background: #fff; color: var(--ink); transform: translateY(-3px); box-shadow: 0 10px 22px rgba(22,24,29,.12); }
  .dish .pic { height: 92px; display: grid; place-items: center; font-size: 3rem; }
  .dish .txt { padding: 10px 12px 12px; }
  .dish .txt b { display: block; font-size: .92rem; line-height: 1.25; }
  .dish .txt span { font-size: .85rem; color: var(--muted); }
  .dish.home { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: transparent; border: 1px dashed #c9c6bd; box-shadow: none; }
  .dish.home .pic { height: auto; font-size: 1.8rem; }

  /* panier */
  .receipt { background: #fff; border-radius: 16px; padding: 18px 18px 6px; box-shadow: 0 2px 12px rgba(22,24,29,.08); }
  .receipt .item { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
  .receipt .item .e { font-size: 2.2rem; }
  .line { display: flex; justify-content: space-between; padding: 9px 0; font-size: .95rem; border-bottom: 1px solid var(--line); }
  .line.total { font-weight: 700; font-size: 1.1rem; border-bottom: 0; }
  .line .free { color: var(--mint); font-weight: 700; }
  .line s { color: var(--muted); margin-right: 6px; }
  .badge-plus { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .08em; background: var(--mint); color: #fff; padding: 3px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }

  /* livraison */
  .track { position: relative; height: 70px; margin: 26px 0 10px; border-bottom: 3px dotted #c9c6bd; }
  .scooter { position: absolute; bottom: 4px; left: 0; font-size: 2.4rem; animation: ride 1.8s ease-in-out forwards; }
  .track .home { position: absolute; right: 0; bottom: 4px; font-size: 2.2rem; }
  @keyframes ride { to { left: calc(100% - 90px); } }
  .delivered { text-align: center; font-family: var(--serif); font-size: 1.6rem; opacity: 0; transition: opacity .3s; }
  .delivered.on { opacity: 1; }

  /* offre Plus : le test A/B */
  .sheet { background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 18px 40px rgba(22,24,29,.16); animation: arrive .5s ease both; }
  .sheet .band { background: linear-gradient(135deg, #00a896, #007a6e); color: #fff; padding: 22px 22px 18px; }
  .sheet .band small { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .9; }
  .sheet .band h2 { color: #fff; margin: 6px 0 0; padding: 0; border: 0; font-size: 1.6rem; }
  .sheet .body { padding: 20px 22px 18px; }
  .sheet .price { font-family: var(--serif); font-size: 2.8rem; line-height: 1; margin: 0 0 14px; }
  .sheet .price small { font-family: var(--sans); font-size: .95rem; color: var(--muted); }
  .sheet ul { list-style: none; padding: 0; margin: 0 0 6px; }
  .sheet li { padding: 6px 0 6px 30px; position: relative; }
  .sheet li::before { content: "✓"; position: absolute; left: 0; top: 5px; width: 20px; height: 20px; border-radius: 50%; background: var(--mint-soft); color: var(--mint); font-size: .8rem; font-weight: 700; display: grid; place-items: center; }
  .sheet .note { font-size: .75rem; color: var(--muted); text-align: center; margin: 12px 0 0; }

  /* récapitulatif */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
  .stats div { background: #fff; border-radius: 14px; padding: 14px 10px; text-align: center; box-shadow: 0 2px 10px rgba(22,24,29,.06); }
  .stats b { display: block; font-family: var(--serif); font-size: 1.5rem; }
  .stats span { font-size: .75rem; color: var(--muted); }

  /* le juste prix : curseurs */
  .mood { text-align: center; font-size: 4rem; line-height: 1; margin: 10px 0 4px; transition: transform .2s; }
  .gauge-value { text-align: center; font-family: var(--serif); font-size: 3rem; margin: 0; }
  .gauge-value.idle { color: #c9c6bd; }
  input[type=range] { width: 100%; height: 44px; accent-color: var(--mint); }
  .scale { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); }
  .prev { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .prev span { font-size: .78rem; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .fine { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
  .fine button { margin: 0; padding: 6px 16px; border-radius: 999px; background: #fff; color: var(--ink); border: 1px solid var(--line); }

  /* cartes à balayer */
  .deck { position: relative; height: 290px; margin: 16px 0 10px; }
  .card { position: absolute; inset: 0; background: #fff; border-radius: 22px; box-shadow: 0 14px 34px rgba(22,24,29,.14); display: grid; place-items: center; text-align: center; touch-action: pan-y; user-select: none; cursor: grab; transition: transform .35s ease, opacity .35s ease; }
  .card .p { font-family: var(--serif); font-size: 3.6rem; line-height: 1; }
  .card .p small { display: block; font-family: var(--sans); font-size: .95rem; color: var(--muted); margin-top: 6px; }
  .card .stamp { position: absolute; top: 22px; font-weight: 800; font-size: 1.1rem; letter-spacing: .1em; padding: 4px 10px; border: 3px solid; border-radius: 8px; opacity: 0; }
  .card .stamp.yes { left: 22px; color: var(--mint); transform: rotate(-12deg); }
  .card .stamp.no { right: 22px; color: var(--neg); transform: rotate(12deg); }
  .card.behind { transform: scale(.95) translateY(12px); opacity: .6; }
  .swipe-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .swipe-btns button { margin: 0; padding: 16px; font-size: 1.1rem; border-radius: 14px; }
  .swipe-btns .no { background: #fff; color: var(--neg); border: 1px solid var(--neg); }
  .swipe-btns .yes { background: var(--mint); border-color: var(--mint); }
  .counter { text-align: center; font-size: .82rem; color: var(--muted); }

  .stepper { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 14px 0; }
  .stepper button { margin: 0; width: 56px; height: 56px; padding: 0; font-size: 1.6rem; border-radius: 50%; background: #fff; color: var(--ink); border: 1px solid var(--ink); }
  .stepper output { font-family: var(--serif); font-size: 3rem; min-width: 2.5ch; text-align: center; }

  /* fin */
  .badge { text-align: center; background: #fff; border-radius: 22px; padding: 26px 20px; box-shadow: 0 14px 34px rgba(22,24,29,.1); margin: 18px 0; }
  .badge .e { font-size: 4rem; }
  .badge b { display: block; font-family: var(--serif); font-size: 1.6rem; margin-top: 6px; }
  .confetti { position: fixed; top: -20px; font-size: 1.4rem; animation: fall 2.4s linear forwards; pointer-events: none; z-index: 10; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
</style>
</head>
<body>
<main>
  <div class="top" id="top" hidden>
    <div class="chapters"><div><i id="c1"></i></div><div><i id="c2"></i></div><div><i id="c3"></i></div></div>
    <div class="chapter-name" id="chapter"></div>
  </div>
  <p id="testmode" class="todo" hidden><strong>Mode test</strong> Aucune adresse d'enregistrement n'est configurée : les réponses restent dans ce navigateur. Voir le fichier LISEZMOI.</p>
  <div id="app"></div>
</main>

<script>
// Adresse de l'application web Google Apps Script qui enregistre les réponses
// dans la feuille Google Sheets du groupe (voir LISEZMOI.md). Vide = mode test.
const ENDPOINT = "";

// Test A/B : A est le témoin (prix actuel), B la variante (hausse étudiée).
const PRIX_AB = { A: 3.49, B: 4.99 };
// Prix soumis dans Gabor-Granger, en ordre croissant, le même pour tous.
const GG_PRICES = [2.49, 3.49, 4.49, 4.99, 5.99, 6.99];
// Frais de la simulation (fictifs, du même ordre que ceux affichés par les applications).
const FRAIS = { livraison: 2.49, service: 0.99, serviceAbonne: 0.49, seuilAbonne: 12 };

const SCENES = [
  { clock: "🌙", quand: "Lundi, 21 h", ambiance: "Longue journée. Le frigo est vide.",
    plats: [
      { k: "burger", e: "🍔", n: "Smash burger & frites", p: 12.90, bg: "linear-gradient(135deg,#ffd27a,#ff9a62)" },
      { k: "sushi", e: "🍣", n: "Plateau 18 pièces", p: 15.50, bg: "linear-gradient(135deg,#ffc3c3,#ff8e8e)" },
      { k: "pizza", e: "🍕", n: "Pizza margherita", p: 11.00, bg: "linear-gradient(135deg,#ffe29a,#f6b26b)" },
      { k: "ramen", e: "🍜", n: "Ramen tonkotsu", p: 13.90, bg: "linear-gradient(135deg,#ffe8c2,#f0b27a)" }],
    maison: { k: "maison", e: "🍝", n: "Je me fais des pâtes" } },
  { clock: "☀️", quand: "Jeudi, 13 h", ambiance: "Pause déjeuner, pas le temps de sortir.",
    plats: [
      { k: "poke", e: "🥗", n: "Poke bowl saumon", p: 13.50, bg: "linear-gradient(135deg,#c8f2d4,#7fd6a4)" },
      { k: "tacos", e: "🌮", n: "Tacos XL", p: 10.90, bg: "linear-gradient(135deg,#ffe29a,#ffb36b)" },
      { k: "sandwich", e: "🥪", n: "Sandwich & boisson", p: 8.50, bg: "linear-gradient(135deg,#f3e3c3,#d9b98a)" },
      { k: "falafel", e: "🧆", n: "Assiette falafels", p: 12.40, bg: "linear-gradient(135deg,#e5f0c8,#b9d77f)" }],
    maison: { k: "maison", e: "🥖", n: "Je descends à la boulangerie" } },
  { clock: "🎉", quand: "Samedi, 20 h", ambiance: "Des amis passent à l'improviste.",
    plats: [
      { k: "pizzas", e: "🍕", n: "2 pizzas à partager", p: 24.00, bg: "linear-gradient(135deg,#ffe29a,#f6b26b)" },
      { k: "curry", e: "🍛", n: "Curry & naans pour 2", p: 19.80, bg: "linear-gradient(135deg,#ffd9a8,#e9a15e)" },
      { k: "padthai", e: "🍜", n: "Pad thaï x2", p: 22.40, bg: "linear-gradient(135deg,#ffe8c2,#f0b27a)" },
      { k: "burgers", e: "🍔", n: "3 burgers & frites", p: 27.60, bg: "linear-gradient(135deg,#ffd27a,#ff9a62)" }],
    maison: { k: "maison", e: "🍳", n: "On cuisine ensemble" } }
];

const answers = {
  id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
  horodatage: new Date().toISOString(),
  // Tirage au sort de la version à l'ouverture du questionnaire, une chance sur deux.
  version: Math.random() < 0.5 ? "A" : "B",
  sim_commandes: 0,
  sim_total: 0
};
answers.prix_affiche = PRIX_AB[answers.version];
let fraisPayes = 0, economies = 0;

const euro = p => p.toFixed(2).replace(".", ",") + " €";
const key = p => p.toFixed(2).replace(".", "_");
const $ = s => document.querySelector(s);
const app = $("#app");
if (!ENDPOINT) $("#testmode").hidden = false;

// Déroulé : trois chapitres, qui pilotent la barre de progression.
const FLOW = [
  ["accueil", 0], ["appli", 1], ["scene0", 1], ["offre", 1], ["scene1", 1], ["scene2", 1], ["recap", 1],
  ["controle", 2], ["vw1", 2], ["vw2", 2], ["vw3", 2], ["vw4", 2], ["gg", 2],
  ["age", 3], ["statut", 3], ["freq", 3], ["abo", 3], ["fin", 3]
];
const CHAPTERS = ["", "Chapitre 1 · Votre mois en livraison", "Chapitre 2 · Le juste prix", "Chapitre 3 · Et vous ?"];
let pos = 0;

function go(i) {
  pos = i;
  const [name, ch] = FLOW[i];
  $("#top").hidden = ch === 0 || name === "fin";
  [1, 2, 3].forEach(c => {
    const inChapter = FLOW.filter(f => f[1] === c && f[0] !== "fin");
    const done = c < ch ? inChapter.length : c === ch ? inChapter.findIndex(f => f[0] === name) : 0;
    $("#c" + c).style.width = Math.round((done / inChapter.length) * 100) + "%";
  });
  $("#chapter").textContent = CHAPTERS[ch];
  app.innerHTML = `<div class="screen">${SCREENS[name].html()}</div>`;
  window.scrollTo(0, 0);
  SCREENS[name].bind && SCREENS[name].bind();
}
const next = () => go(pos + 1);

// Tuiles à choix unique : enregistre la valeur puis enchaîne.
function tiles(name, options) {
  return `<div class="tiles" data-single="${name}">${options.map(([v, label, ico]) =>
    `<button type="button" class="tile" data-value="${v}">${ico ? `<span class="ico">${ico}</span>` : ""}${label}</button>`).join("")}</div>`;
}
function bindTiles() {
  const group = app.querySelector("[data-single]");
  group.addEventListener("click", e => {
    const t = e.target.closest(".tile"); if (!t) return;
    group.querySelectorAll(".tile").forEach(x => x.setAttribute("aria-pressed", x === t));
    answers[group.dataset.single] = t.dataset.value;
    setTimeout(next, 260);
  });
}

// Une scène : choisir un plat, voir le panier, se faire livrer.
function sceneScreen(n) {
  const s = SCENES[n];
  return {
    html: () => `
      <div class="scene-head"><span class="clock">${s.clock}</span><div><b>${s.quand}</b><span>${s.ambiance}</span></div></div>
      <p class="title" style="font-size:1.4rem">Qu'est-ce qui vous fait envie ?</p>
      <div class="menu">
        ${s.plats.map(p => `<button type="button" class="dish" data-k="${p.k}"><div class="pic" style="background:${p.bg}">${p.e}</div><div class="txt"><b>${p.n}</b><span>${euro(p.p)}</span></div></button>`).join("")}
        <button type="button" class="dish home" data-k="${s.maison.k}"><span class="pic">${s.maison.e}</span><b>${s.maison.n}</b></button>
      </div>`,
    bind: () => app.querySelectorAll(".dish").forEach(b => b.addEventListener("click", () => {
      answers["sim_" + (n + 1)] = b.dataset.k;
      const plat = s.plats.find(p => p.k === b.dataset.k);
      plat ? basket(n, plat) : next();
    }))
  };
}
function basket(n, plat) {
  const abonne = answers.souscription === 1;
  const livraisonOfferte = abonne && plat.p >= FRAIS.seuilAbonne;
  const livraison = livraisonOfferte ? 0 : FRAIS.livraison;
  const service = abonne ? FRAIS.serviceAbonne : FRAIS.service;
  const total = plat.p + livraison + service;
  app.innerHTML = `<div class="screen">
    <p class="kicker">Votre panier</p>
    <div class="receipt">
      <div class="item"><span class="e">${plat.e}</span><div><b>${plat.n}</b><br><span class="src">${euro(plat.p)}</span></div></div>
      <div class="line"><span>Frais de livraison${abonne ? '<span class="badge-plus">PLUS</span>' : ""}</span><span>${livraisonOfferte ? `<s>${euro(FRAIS.livraison)}</s><span class="free">Offerte</span>` : euro(livraison)}</span></div>
      <div class="line"><span>Frais de service</span><span>${abonne ? `<s>${euro(FRAIS.service)}</s>` : ""}${euro(service)}</span></div>
      <div class="line total"><span>Total</span><span>${euro(total)}</span></div>
    </div>
    ${abonne && !livraisonOfferte ? `<p class="src">Livraison offerte aux abonnés dès ${euro(FRAIS.seuilAbonne)} d'achat.</p>` : ""}
    <button type="button" class="btn" id="cmd">Commander · ${euro(total)}</button>
    <button type="button" class="btn ghost" id="annuler">Finalement non, je m'en passe</button>
  </div>`;
  $("#annuler").addEventListener("click", () => { answers["sim_" + (n + 1)] = "annule"; next(); });
  $("#cmd").addEventListener("click", () => {
    answers.sim_commandes += 1;
    answers.sim_total = Math.round((answers.sim_total + total) * 100) / 100;
    fraisPayes += livraison + service;
    economies += (FRAIS.livraison - livraison) + (FRAIS.service - service);
    app.innerHTML = `<div class="screen">
      <p class="kicker">Commande en route</p>
      <p class="title">${plat.e} arrive…</p>
      <div class="track"><span class="scooter">🛵</span><span class="home">🏠</span></div>
      <p class="delivered" id="ok">Livré ! Bon appétit 😋</p></div>`;
    setTimeout(() => $("#ok").classList.add("on"), 1800);
    setTimeout(next, 2700);
  });
}

// Les curseurs du juste prix (Van Westendorp), toujours dans le même ordre.
const VW = [
  { k: "vw_trop_bon_marche", mood: "🤨", q: "À partir de quel prix mensuel cet abonnement serait-il <b>si bon marché</b> que vous douteriez de sa qualité ?" },
  { k: "vw_bon_marche", mood: "😊", q: "À quel prix mensuel serait-il une <b>bonne affaire</b> ?" },
  { k: "vw_cher", mood: "😬", q: "À quel prix mensuel commencerait-il à être <b>cher</b>, sans exclure de le prendre ?" },
  { k: "vw_trop_cher", mood: "🙅", q: "À partir de quel prix mensuel serait-il <b>trop cher</b> pour que vous l'envisagiez ?" }
];
function vwScreen(i) {
  const v = VW[i];
  return {
    html: () => `
      <p class="kicker">Le juste prix · ${i + 1} / 4</p>
      <p class="title" style="font-size:1.35rem">${v.q}</p>
      <p class="sub">Pour l'abonnement Deliveroo Plus, indépendamment des prix vus jusqu'ici. Faites glisser le curseur.</p>
      <div class="mood" id="mood">${v.mood}</div>
      <p class="gauge-value idle" id="val">? €</p>
      <input type="range" id="rng" min="0" max="20" step="0.1" value="0" aria-label="Prix mensuel en euros">
      <div class="scale"><span>0 €</span><span>10 €</span><span>20 € et plus</span></div>
      <div class="fine"><button type="button" id="moins">− 0,10 €</button><button type="button" id="plus">+ 0,10 €</button></div>
      ${i ? `<div class="prev">${VW.slice(0, i).map(p => `<span>${p.mood} ${euro(answers[p.k])}</span>`).join("")}</div>` : ""}
      <p class="err" id="err" hidden>Faites glisser le curseur pour indiquer un prix.</p>
      <button type="button" class="btn" id="ok">Valider</button>`,
    bind: () => {
      let touched = false;
      const rng = $("#rng");
      const show = () => { touched = true; $("#val").textContent = euro(Number(rng.value)); $("#val").classList.remove("idle"); $("#mood").style.transform = `scale(${1 + Number(rng.value) / 40})`; };
      rng.addEventListener("input", show);
      $("#moins").addEventListener("click", () => { rng.value = Math.max(0, Number(rng.value) - 0.1).toFixed(1); show(); });
      $("#plus").addEventListener("click", () => { rng.value = Math.min(20, Number(rng.value) + 0.1).toFixed(1); show(); });
      $("#ok").addEventListener("click", () => {
        if (!touched) { $("#err").hidden = false; return; }
        answers[v.k] = Math.round(Number(rng.value) * 100) / 100;
        if (i === 3) {
          const a = VW.map(p => answers[p.k]);
          // Les quatre réponses doivent monter ; sinon le répondant sera écarté à l'analyse.
          answers.vw_coherent = a[0] <= a[1] && a[1] <= a[2] && a[2] <= a[3] ? 1 : 0;
        }
        next();
      });
    }
  };
}

      const drag = card => {
        let x0 = null, dx = 0;

async function send() {
  if (!ENDPOINT) {
    const all = JSON.parse(localStorage.getItem("reponses_test") || "[]");
    all.push(answers);
    localStorage.setItem("reponses_test", JSON.stringify(all));
    return;
  }
  try {
    // text/plain + no-cors : Apps Script n'accepte pas les requêtes préliminaires CORS.
    await fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(answers) });
  } catch (e) {
    const msg = $("#fin-msg");
    if (msg) msg.textContent = "L'envoi a échoué. Vérifiez votre connexion et rechargez la page pour recommencer.";
  }
}

go(0);
